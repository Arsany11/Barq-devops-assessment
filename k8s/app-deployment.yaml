apiVersion: apps/v1
kind: Deployment
metadata:
  name: barq-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: barq-app
  template:
    metadata:
      labels:
        app: barq-app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: barq-app
      containers:
      - name: app
        image: barq-assessment-app-01:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: barq-config
        - secretRef:
            name: barq-secrets
        env:
        - name: INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
