apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 80;
        location / {
            resolver 10.96.0.10 valid=30s;
            set $upstream_app barq-app-service.default.svc.cluster.local;
            proxy_pass http://$upstream_app:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
